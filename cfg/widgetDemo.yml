    # Warning banner demo. `setChannelsOnLoad` forces a few channels over-threshold (page-scoped — it
    # does NOT leak to other pages) so banners are visibly active here. Shows all four severities/looks:
    # built-in defaults (Undervoltage red, CPU Temp amber) + two user rules (Oil Temp High red, and the
    # blue "cold" Coolant Temp Too Low), ordered by severity (desc) then config order, capped at
    # maxBanners=4, pushing the grid content below them down.
    - id: demoWarnings
      # Row 1 (auto) holds the banner; row 2 (1fr) absorbs the leftover height so the banner row is
      # NOT stretched to fill the page (otherwise the gap under the banner grows as banners clear).
      contentGridClass: "col-span-2 row-start-1 row-span-1 grid h-full min-h-0 min-w-0 grid-cols-2 grid-rows-[auto_minmax(0,1fr)] gap-4 max-md:col-span-1 max-md:grid-cols-1"
      setChannelsOnLoad:
        system.hwPerf.underVoltageNow: 1
        system.hwPerf.tempC: 88
        demo.oilTempC: 145
        demo.coolantTempC: 55
        demo.dtcCount: 3
      widgets:
        - id: warn-demo
          widget: warningBanner
          gridClass: "col-span-full row-start-1 min-w-0"
          params:
            maxBanners: 4
            keepDefaults: true
            rules:
              # DTC-style banner: greaterThan on a numeric count channel (setChannelsOnLoad only
              # supports numbers; in real use wire to a text channel with `when: isSet, detail: "="`).
              - channel: demo.dtcCount
                when: greaterThan
                threshold: 0
                severity: 80
                title: Active DTCs
                detail: "ECM[P0420 Catalyst efficiency below threshold, P0300 Random/multiple misfire detected]; TCM[P1234 Gear ratio error 4th]"
                color: "oklch(0.73 0.18 40)"
              # User rule (tried first in config order; severity decides display order).
              - channel: demo.oilTempC
                when: greaterThan
                threshold: 130
                severity: 90
                title: Oil Temp High
                detail: Reduce load
                unit: "°C"
                color: "oklch(0.70 0.23 25)"
              - channel: demo.coolantTempC
                when: lowerThan
                threshold: 70
                severity: 5
                title: Coolant Temp Too Low
                detail: Warm engine before pushing
                unit: "°C"
                color: "oklch(0.55 0.20 255)"
                darkText: false
        - id: warn-demo-note
          widget: textData
          gridClass: "min-h-[min(40vh,320px)] min-w-0"
          params:
            title: Grid content (pushed down by banners)
            value: "=4"
            unit: " active"
            labelPosition: bottom
