# Layout demo only — full config documentation is the header in cfg/main.yml.
lapTimer: {}

canBuses:
  can0: 500000

channelAliases:
  gpsLat: system.gps.latitudeDeg, aim.AIM_GPSLatLon_6A3.GPSLatitude_deg, racebox.nav.latitudeDeg, system.WebGPS.latitudeDeg
  gpsLon: system.gps.longitudeDeg, aim.AIM_GPSLatLon_6A3.GPSLongitude_deg, racebox.nav.longitudeDeg, system.WebGPS.longitudeDeg
  gpsSpeedKph: system.gps.gpsSpeedKph, aim.AIM_GPSQuality_6A1.GPSSpeed_kph_x10, racebox.nav.gpsSpeedKph, system.WebGPS.gpsSpeedKph
  gpsHorizontalAccuracyM: system.gps.horizontalAccuracyM, aim.AIM_GPSQuality_6A1.GPSPosAccuracy_m, racebox.nav.horizontalAccuracyM, system.WebGPS.horizontalAccuracyM
  gpsSatellites: system.gps.satellites, aim.AIM_GPSQuality_6A1.GPSSatellites, racebox.nav.numSVs
  gpsSampleTimeMs: system.gps.tsMs, aim.AIM_Time_6A0.RollingTime_ms, racebox.nav.tsMs

ui:
  channelSources:
    - key: ttpms
      file: official/IZZE_TTPMS.dbc
      bus: can0
    - key: mclarenlife
      file: mclaren_720s.dbc
      bus: can0
    - key: aim
      file: aim/AiM_CAN_Output_custom.dbc
      bus: can0
    - !include mclarenDiag.yml
  globalLayout:
    rootGridClass: "max-md:grid-cols-1"
  pages:
    # Control-bar status icons (GPS pin / modem-wifi-none / link text / battery) in every
    # variant, straight from the shared statusIcons module the live ControlBar uses.
    # Satellite map + sky view side by side, in the same 2:1 split the debug page uses. The map runs
    # on preset coordinates because a demo has no GPS source; the sky view is fed a fixed sky string
    # in the same format the GNSS runtime emits, so the plot is exercised without hardware.
    - id: demoSatelliteAndSky
      # 4 columns, 3:1 split — matches the real debug page (cfg/debug.yml), which uses `md:` rather
      # than `lg:` for exactly this reason: kiosk CSS viewport width (Waveshare panels run at
      # --force-device-scale-factor=1.3) never reaches the 1024px `lg:` breakpoint.
      contentGridClass: "col-span-2 row-start-1 row-span-1 grid h-full min-h-0 min-w-0 grid-cols-4 gap-4 max-md:col-span-1 max-md:grid-cols-1"
      widgets:
        - id: demo-satellite-preview
          widget: satellitePreview
          gridClass: "min-w-0 max-w-full overflow-clip col-span-3 max-md:col-span-1"
          params:
            title: Satellite
            # Preset position (Sofia) — no channel binding, so the widget renders with no GPS source.
            latValue: 42.69770
            lonValue: 23.32190
            zoom: 18
            width: 640
            height: 640
            moveRefreshM: 45
            requiresTapToActivate: false
            provider: esri
        - id: demo-sky-view
          widget: skyView
          gridClass: "min-w-0 col-span-1"
          params:
            title: Sky view
            channel: demo.skyView
            minCno: 20
            showHeatmap: true
            # A plausible Sofia sky, in the exact format the runtime emits: letter+SV, azimuth,
            # elevation, C/N0, used. Weak birds (<20) render hollow, used ones carry a ring.
            sampleSky: "G12:210:34:38:1;G24:145:62:41:1;G19:78:22:29:1;G13:300:48:36:1;G17:31:12:24:0;G25:255:71:39:1;G6:118:8:19:0;E7:150:55:35:1;E30:22:41:33:1;E8:190:28:31:1;E2:330:66:37:1;E25:95:15:22:0;B23:167:39:32:1;B25:243:52:34:1;B8:14:19:25:0;R3:288:44:30:1;R11:60:33:28:1;S36:172:31:29:0;Q1:205:9:17:0;G32:340:26:27:1"
    - id: demoStatusIcons
      contentGridClass: "col-span-2 row-start-1 row-span-1 grid h-full min-h-0 min-w-0 grid-cols-1 gap-4 max-md:col-span-1"
      widgets:
        - id: status-icons-gallery
          widget: statusIconsDemo
          gridClass: ""
          params:
            title: "Status icons"
    - id: demoLapDelta
      contentGridClass: "col-span-2 row-start-1 row-span-1 grid h-full min-h-0 min-w-0 grid-cols-2 gap-4 max-md:col-span-1 max-md:grid-cols-1"
      widgets:
        # Colors: green faster / red slower / white ~zero; unknown = static em dash.
        - id: delta-faster
          widget: textDataLapDelta
          gridClass: ""
          params:
            title: "Lap Delta (Faster)"
            channel: "=-0.284"
            format: signedDelta
            decimals: 3
            labelPosition: bottom
            displaySource: true
        - id: delta-slower
          widget: textDataLapDelta
          gridClass: ""
          params:
            title: "Lap Delta (Slower)"
            channel: "=+0.412"
            format: signedDelta
            decimals: 3
            labelPosition: bottom
            displaySource: true
        - id: delta-zero
          widget: textDataLapDelta
          gridClass: ""
          params:
            title: "Lap Delta (Zero)"
            channel: "=0.000"
            format: signedDelta
            decimals: 3
            labelPosition: bottom
            displaySource: true
        - id: delta-unknown
          widget: textDataLapDelta
          gridClass: ""
          params:
            title: "Lap Delta (Unknown)"
            channel: ""
            value: "—"
            format: signedDelta
            decimals: 3
            labelPosition: bottom
        # Only when both channels set (distinct from single `channel` binding).
        - id: delta-pred-minus-best
          widget: textDataLapDelta
          gridClass: ""
          params:
            title: "Lap Delta (Pred − Best)"
            predictiveChannel: "=95.284"
            bestChannel: "=95.000"
            value: "0"
            format: signedDelta
            decimals: 3
            labelPosition: bottom
            displaySource: false

    # lapDeltaBar (the big bar widget) in both normal and stopped states. All channels are forced with
    # `=value` constants, so the demo needs no live data: `stopSpeedChannel` forces the raw speed test
    # (`=50` = moving, `=0` = at rest) instead of the live system.motion.stopped verdict, and
    # `lapCountChannel: "=N"` fakes the completed-lap count the `afterLap` mode checks.
    - id: demoLapDeltaBar
      contentGridClass: "col-span-2 row-start-1 row-span-1 grid min-h-0 min-w-0 grid-cols-2 gap-4 content-start max-md:col-span-1 max-md:grid-cols-1"
      widgets:
        - id: ldbar-faster
          widget: lapDeltaBar
          gridClass: "min-h-[min(38vh,280px)] min-w-0"
          params:
            title: "Lap Delta Bar (Faster · moving)"
            channel: "=-0.284"
            decimals: 3
            unit: s
            range: 1.5
            stopSpeedChannel: "=50"
        - id: ldbar-slower
          widget: lapDeltaBar
          gridClass: "min-h-[min(38vh,280px)] min-w-0"
          params:
            title: "Lap Delta Bar (Slower · moving)"
            channel: "=+0.412"
            decimals: 3
            unit: s
            range: 1.5
            stopSpeedChannel: "=50"
        - id: ldbar-stopped
          widget: lapDeltaBar
          gridClass: "min-h-[min(38vh,280px)] min-w-0"
          params:
            title: "Lap Delta Bar (Stopped)"
            channel: "=-0.284"
            stopSpeedChannel: "=0"
            stoppedMode: always
        - id: ldbar-armed-prelap
          widget: lapDeltaBar
          gridClass: "min-h-[min(38vh,280px)] min-w-0"
          params:
            # At rest but no lap completed yet → afterLap keeps the delta rolling (armed), not STOPPED.
            title: "Lap Delta Bar (At rest, pre-lap → armed)"
            channel: "=-0.050"
            decimals: 3
            unit: s
            range: 1.5
            stopSpeedChannel: "=0"
            stoppedMode: afterLap
            lapCountChannel: "=0"
        - id: ldbar-afterlap-stopped
          widget: lapDeltaBar
          gridClass: "min-h-[min(38vh,280px)] min-w-0"
          params:
            # At rest after a completed lap → afterLap shows STOPPED.
            title: "Lap Delta Bar (At rest, post-lap → STOPPED)"
            channel: "=-0.050"
            stopSpeedChannel: "=0"
            stoppedMode: afterLap
            lapCountChannel: "=2"

    - id: demoMultiTire
