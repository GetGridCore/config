# BMW DS2 engine data from a Bosch M5.2 DME (M44 4-cylinder, E36 318ti) over the K-line (OBD pin 7).
# One `ui.channelSources` row — add it with `- !include ds2M52.yml`. Channels: `ds2Dme.<field name>`.
#
# Layout of the DMV 318ti Cup car's DME (software 1429924), 2026-11-24, from three sources that agree:
#   - BMW's EDIABAS description for this DME, DM524DS0.prg (rev 1.18, "DME 5.2 fuer M44"), jobs disassembled;
#   - the 1429924 ROM read in github.com/ba114/M5.2 (block builders disassembled: every byte's RAM source);
#   - replies captured from the car at idle (54-byte analog block, 22-byte switch block).
# Fields marked UNVERIFIED have the right byte but no confirmed scaling. The M5.2 is shared with the M62 V8, so
# BMW's description also has bank-2 values and VANOS / secondary-air bits; this 4-cylinder has none — left out.
# A reply whose length differs from `replyDataLength` is never decoded.
# Offsets count from the first data byte after the 0xA0 acknowledge byte.
key: ds2Dme
bus: kline-ds2
ds2:
  adapter: stn            # stn = OBDLink EX (USB); openport = Tactrix OpenPort 2.0
  device: auto
  ecuAddress: 0x12
  responseTimeoutMs: 300
  interRequestGapMs: 10
  fastHz: 10
  slowHz: 1
  telegrams:
    - name: analog
      request: [0x0B, 0x03]
      group: fast
      replyDataLength: 54
      fields:
        - { name: airMassKgH, byte: 0, type: u16le, mul: 0.25 }
        # UNVERIFIED scaling (community ×0.024 ms; BMW's ×0.00534 gives an implausible 0.9 ms at idle).
        - { name: injectionTimeMs, byte: 4, type: u16le, mul: 0.024 }
        # Lambda control: 0x8000 = neutral → 1.0.
        - { name: lambdaIntegrator, byte: 6, type: u16le, mul: 0.000030517578125 }
        - { name: lambdaAdaptAdditiveRaw, byte: 10, type: s16le }
        - { name: lambdaAdaptMultiplicative, byte: 14, type: u16le, mul: 0.000030517578125 }
        - { name: rpm, byte: 18, type: u8, mul: 40 }
        # UNVERIFIED scaling: throttle above the learned closed position (byte 24), not a 0–100 % angle.
        - { name: throttlePct, byte: 19, type: u8, mul: 0.392157 }
        # UNVERIFIED: BMW's own formula; reads -44° at idle. Confirm the direction at ~2500 rpm.
        - { name: ignitionAngleDeg, byte: 20, type: u8, mul: -0.75, add: 54 }
        - { name: loadMs, byte: 21, type: u8, mul: 0.05 }
        - { name: intakeAirTempC, byte: 22, type: u8, mul: 0.75, add: -48 }
        - { name: coolantTempC, byte: 23, type: u8, mul: 0.75, add: -48 }
        - { name: throttleClosedRaw, byte: 24, type: u8 }
        - { name: idleAirDemandKgH, byte: 25, type: u8, mul: 0.25 }
        # BMW scales ×1.112, the community ×1.25; unverified (0 while stationary).
        - { name: vehicleSpeedKph, byte: 26, type: u8, mul: 1.25 }
        - { name: batteryV, byte: 28, type: u8, mul: 0.094309 }
        # Four words in a row, one per cylinder by their layout; meaning unknown (logged to identify them).
        - { name: cyl1Raw, byte: 36, type: u16le }
        - { name: cyl2Raw, byte: 38, type: u16le }
        - { name: cyl3Raw, byte: 40, type: u16le }
        - { name: cyl4Raw, byte: 42, type: u16le }
    - name: switches
      request: [0x0B, 0x04]
      group: slow
      replyDataLength: 22
      fields:
        # Byte 7 confirmed in the ROM: the DME's own idle / full-load decision from the throttle.
        - { name: fullLoad, byte: 7, type: bit, bit: 0 }
        - { name: idle, byte: 7, type: bit, bit: 1 }
        - { name: fuelPump, byte: 2, type: bit, bit: 0 }
